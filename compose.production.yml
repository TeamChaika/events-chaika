name: chaika-events

services:
  app:
    build: .
    restart: unless-stopped
    env_file: ${PRODUCTION_ENV_FILE:-/etc/chaika-events/app.env}
    environment:
      NODE_ENV: production
      PORT: "8787"
      DB_PATH: /app/data/events.sqlite
      APP_ORIGIN: https://event.chaika.team
      TRUST_PROXY_HOPS: "1"
      DEMO_MODE: "false"
    volumes:
      - app_data:/app/data
    expose:
      - "8787"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  app_data:
  caddy_data:
  caddy_config:
