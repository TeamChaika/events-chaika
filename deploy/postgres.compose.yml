name: chaika-events-db
services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
      - -c
      - hba_file=/config/pg_hba.conf
      - -c
      - max_connections=30
      - -c
      - shared_buffers=128MB
      - -c
      - log_statement=none
    ports:
      - "${DB_BIND_IP}:55432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./certs:/certs:ro
      - ./pg_hba.conf:/config/pg_hba.conf:ro
      - ./init.sql:/docker-entrypoint-initdb.d/events.sql:ro
    mem_limit: 1g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U events_owner -d chaika_events"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
